name: Build and Release oneclickvirt
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-agent-amd64:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
      with:
        targets: x86_64-unknown-linux-musl
        toolchain: stable
    - name: Install musl tools
      run: |
        sudo apt-get update
        sudo apt-get install -y musl-tools
    - name: Cache Rust dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          server/agent/target
        key: ${{ runner.os }}-cargo-amd64-${{ hashFiles('server/agent/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-amd64-
    - name: Build monitoring agent (AMD64)
      working-directory: ./server/agent
      run: |
        cargo build --locked --release --target x86_64-unknown-linux-musl
        cp target/x86_64-unknown-linux-musl/release/oneclickvirt-agent oneclickvirt-agent-linux-amd64
    - name: Upload AMD64 agent artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: agent-amd64
        path: server/agent/oneclickvirt-agent-linux-amd64
  build-agent-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
      with:
        targets: aarch64-unknown-linux-musl
        toolchain: stable
    - name: Install musl tools
      run: |
        sudo apt-get update
        sudo apt-get install -y musl-tools
    - name: Cache Rust dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          server/agent/target
        key: Linux-arm64-cargo-arm64-${{ hashFiles('server/agent/Cargo.lock') }}
        restore-keys: |
          Linux-arm64-cargo-arm64-
    - name: Build monitoring agent (ARM64)
      working-directory: ./server/agent
      run: |
        cargo build --locked --release --target aarch64-unknown-linux-musl
        cp target/aarch64-unknown-linux-musl/release/oneclickvirt-agent oneclickvirt-agent-linux-arm64
    - name: Upload ARM64 agent artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: agent-arm64
        path: server/agent/oneclickvirt-agent-linux-arm64
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    needs:
    - build-agent-amd64
    - build-agent-arm64
    steps:
    - name: Load trusted network recovery helpers
      shell: bash
      run: |
        set -euo pipefail
        curl --fail --silent --show-error --location --connect-timeout 15 --max-time 90 --retry 3 --retry-max-time 180 --retry-connrefused "https://raw.githubusercontent.com/oneclickvirt/oneclickvirt/main/.github/scripts/ci_network.sh" -o "$RUNNER_TEMP/ci-network.sh"
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: server/go.mod
        cache: true
        cache-dependency-path: server/go.sum
    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: web/package-lock.json
    - name: Regenerate Swagger docs and auto-commit if changed
      working-directory: ./server
      run: |
        go run github.com/swaggo/swag/cmd/swag@v1.16.6 init --parseDependency --parseInternal
        if ! git diff --exit-code -- docs; then
          echo "::warning::Swagger docs are out of date. Auto-committing updates..."
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add docs/
          git commit -m "docs: auto-update swagger docs [skip ci]"
          git push
          echo "Swagger docs updated and pushed to repository."
        else
          echo "Swagger docs are up to date."
        fi
    - name: Get current date
      id: date
      run: echo "date=$(date +'%Y%m%d-%H%M%S')" >> "$GITHUB_OUTPUT"
    - name: Create build directory
      run: mkdir -p build
    - name: Download agent artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        path: build/agents
    - name: Stage agent binaries
      run: |
        cp build/agents/agent-amd64/oneclickvirt-agent-linux-amd64 build/oneclickvirt-agent-linux-amd64
        cp build/agents/agent-arm64/oneclickvirt-agent-linux-arm64 build/oneclickvirt-agent-linux-arm64
        chmod +x build/oneclickvirt-agent-linux-amd64 build/oneclickvirt-agent-linux-arm64
    - name: Prepare controller agent assets
      run: |
        mkdir -p build/controller-agent web/public/controller-agent server/assets/agent
        cp scripts/install_agent.sh build/controller-agent/install_agent.sh
        cp scripts/install_agent.sh web/public/controller-agent/install_agent.sh
        cp scripts/install_agent.sh server/assets/agent/install_agent.sh

        tmp_amd64=$(mktemp -d)
        cp build/oneclickvirt-agent-linux-amd64 "$tmp_amd64/oneclickvirt-agent"
        tar -C "$tmp_amd64" -czf build/controller-agent/oneclickvirt-agent-linux-amd64.tar.gz oneclickvirt-agent
        rm -rf "$tmp_amd64"

        tmp_arm64=$(mktemp -d)
        cp build/oneclickvirt-agent-linux-arm64 "$tmp_arm64/oneclickvirt-agent"
        tar -C "$tmp_arm64" -czf build/controller-agent/oneclickvirt-agent-linux-arm64.tar.gz oneclickvirt-agent
        rm -rf "$tmp_arm64"

        cp build/controller-agent/oneclickvirt-agent-linux-amd64.tar.gz web/public/controller-agent/
        cp build/controller-agent/oneclickvirt-agent-linux-arm64.tar.gz web/public/controller-agent/
        cp build/controller-agent/oneclickvirt-agent-linux-amd64.tar.gz server/assets/agent/
        cp build/controller-agent/oneclickvirt-agent-linux-arm64.tar.gz server/assets/agent/
    - name: Update version constants for this release
      run: |
        TAG_NAME="v${{ steps.date.outputs.date }}"
        sed -i "s/const ServerVersion = \".*\"/const ServerVersion = \"${TAG_NAME}\"/" server/constant/version.go
        AGENT_VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' server/agent/Cargo.toml | head -1)
        MIN_AGENT_VERSION=$(sed -n 's/^const CompatibleAgentVersion = "\([^"]*\)"/\1/p' server/constant/version.go)
        CURRENT_AGENT_VERSION=$(sed -n 's/^const CurrentAgentVersion = "\([^"]*\)"/\1/p' server/constant/version.go)
        test -n "${AGENT_VERSION}"
        test "${AGENT_VERSION}" = "${CURRENT_AGENT_VERSION}"
        python3 - "${AGENT_VERSION}" "${MIN_AGENT_VERSION}" <<'PY'
        import sys
        version, minimum = (tuple(map(int, value.split('.'))) for value in sys.argv[1:])
        assert version >= minimum, 'Agent release is below the minimum compatible version'
        PY
        echo "Updated controller release tag to: ${TAG_NAME}; minimum Agent API version: ${MIN_AGENT_VERSION}"
        cat server/constant/version.go
    - name: Build Vue web application
      run: |
        cd web
        npm ci --include=optional
        npm run test:unit
        npm run build
        cd dist
        zip -r ../../build/web-dist.zip .
    - name: Build Go server binaries (Standalone - without embedded frontend)
      working-directory: ./server
      run: |
        export GO111MODULE=on
        go mod download
        go mod verify
        export CGO_ENABLED=0
        BUILD_COMMIT=$(git rev-parse HEAD)
        BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        BUILD_SIGNATURE="official-github-actions"
        export LDFLAGS="-s -w -extldflags '-static' -X oneclickvirt/constant.BuildCommit=${BUILD_COMMIT} -X oneclickvirt/constant.BuildTime=${BUILD_TIME} -X oneclickvirt/constant.BuildSignature=${BUILD_SIGNATURE}"

        # Linux AMD64
        GOOS=linux GOARCH=amd64 go build -ldflags="$LDFLAGS" -o ../build/server-linux-amd64 .

        # Linux ARM64
        GOOS=linux GOARCH=arm64 go build -ldflags="$LDFLAGS" -o ../build/server-linux-arm64 .

        # Windows AMD64
        GOOS=windows GOARCH=amd64 go build -ldflags="$LDFLAGS" -o ../build/server-windows-amd64.exe .

        # Windows ARM64
        GOOS=windows GOARCH=arm64 go build -ldflags="$LDFLAGS" -o ../build/server-windows-arm64.exe .
    - name: Prepare embedded frontend
      run: |
        rm -rf server/service/router/dist
        mkdir -p server/service/router/dist
        cp -R web/dist/. server/service/router/dist/
    - name: Verify the actual embedded frontend and static responses
      working-directory: ./server
      run: go test -tags embed ./service/router
    - name: Build Go server binaries (All-in-one - with embedded frontend)
      working-directory: ./server
      run: |
        export GO111MODULE=on
        export CGO_ENABLED=0
        BUILD_COMMIT=$(git rev-parse HEAD)
        BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        BUILD_SIGNATURE="official-github-actions"
        export LDFLAGS="-s -w -extldflags '-static' -X oneclickvirt/constant.BuildCommit=${BUILD_COMMIT} -X oneclickvirt/constant.BuildTime=${BUILD_TIME} -X oneclickvirt/constant.BuildSignature=${BUILD_SIGNATURE}"

        # Linux AMD64 (with embedded frontend)
        GOOS=linux GOARCH=amd64 go build -tags embed -ldflags="$LDFLAGS" -o ../build/server-allinone-linux-amd64 .

        # Linux ARM64 (with embedded frontend)
        GOOS=linux GOARCH=arm64 go build -tags embed -ldflags="$LDFLAGS" -o ../build/server-allinone-linux-arm64 .

        # Windows AMD64 (with embedded frontend)
        GOOS=windows GOARCH=amd64 go build -tags embed -ldflags="$LDFLAGS" -o ../build/server-allinone-windows-amd64.exe .

        # Windows ARM64 (with embedded frontend)
        GOOS=windows GOARCH=arm64 go build -tags embed -ldflags="$LDFLAGS" -o ../build/server-allinone-windows-arm64.exe .
    - name: Compress binaries
      run: |
        cd build
        # Compress standalone binaries
        tar -czf server-linux-amd64.tar.gz server-linux-amd64
        tar -czf server-linux-arm64.tar.gz server-linux-arm64
        zip server-windows-amd64.zip server-windows-amd64.exe
        zip server-windows-arm64.zip server-windows-arm64.exe

        # Compress all-in-one binaries
        tar -czf server-allinone-linux-amd64.tar.gz server-allinone-linux-amd64
        tar -czf server-allinone-linux-arm64.tar.gz server-allinone-linux-arm64
        zip server-allinone-windows-amd64.zip server-allinone-windows-amd64.exe
        zip server-allinone-windows-arm64.zip server-allinone-windows-arm64.exe

        # Compress agent binaries
        cp controller-agent/oneclickvirt-agent-linux-amd64.tar.gz oneclickvirt-agent-linux-amd64.tar.gz
        cp controller-agent/oneclickvirt-agent-linux-arm64.tar.gz oneclickvirt-agent-linux-arm64.tar.gz

        # Remove uncompressed binaries
        rm server-linux-amd64 server-linux-arm64 server-windows-amd64.exe server-windows-arm64.exe
        rm server-allinone-linux-amd64 server-allinone-linux-arm64 server-allinone-windows-amd64.exe server-allinone-windows-arm64.exe
        rm oneclickvirt-agent-linux-amd64 oneclickvirt-agent-linux-arm64

        # The panel updater verifies its selected release assets against this
        # manifest before extracting or replacing any local files.
        sha256sum \
          server-linux-amd64.tar.gz \
          server-linux-arm64.tar.gz \
          server-windows-amd64.zip \
          server-windows-arm64.zip \
          server-allinone-linux-amd64.tar.gz \
          server-allinone-linux-arm64.tar.gz \
          server-allinone-windows-amd64.zip \
          server-allinone-windows-arm64.zip \
          oneclickvirt-agent-linux-amd64.tar.gz \
          oneclickvirt-agent-linux-arm64.tar.gz \
          web-dist.zip > SHA256SUMS

        ls -lh
    - name: Package matching Skill and installation helpers
      run: |
        python3 scripts/package_skill.py --version "v${{ steps.date.outputs.date }}" --output-dir build
        (cd build && sha256sum oneclickvirt-skill*.tar.gz oneclickvirt-skill*.sha256 >> SHA256SUMS)
    - name: Get previous release tag
      id: get_previous_tag
      run: |
        PREVIOUS_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
        echo "previous_tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"
        echo "Previous release tag: $PREVIOUS_TAG"
    - name: Create Release with Auto-generated Notes
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: v${{ steps.date.outputs.date }}
        PREVIOUS_TAG: ${{ steps.get_previous_tag.outputs.previous_tag }}
      shell: bash
      run: |
        set -euo pipefail
        source "$RUNNER_TEMP/ci-network.sh"
        cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
        ### 独立部署版本（需要分别部署前后端）
        - `server-linux-{amd64,arm64}.tar.gz` / `server-windows-{amd64,arm64}.zip`：后端
        - `web-dist.zip`：前端静态文件
        ### 一体化部署版本（前端已内嵌）
        - `server-allinone-linux-{amd64,arm64}.tar.gz`
        - `server-allinone-windows-{amd64,arm64}.zip`
        ### 监控代理（部署到 Provider 节点）
        - `oneclickvirt-agent-linux-{amd64,arm64}.tar.gz`
        ### Skill 与 MCP 程序
        - `oneclickvirt-skill.tar.gz` / `oneclickvirt-skill-<本次标签>.tar.gz`：本版本 Skill，内含安装器与 MCP 配置示例
        - `oneclickvirt-skill*.sha256`：Skill 压缩包校验文件
        - 安装及更新：https://www.spiritlhl.net/guide/oneclickvirt/oneclickvirt_advanced_install.html#skill-与-mcp
        ### 校验文件
        - `SHA256SUMS`：Release 资产 SHA-256 校验清单
        NOTES
        arguments=(--title "Release $RELEASE_TAG" --target "$(git rev-parse HEAD)" --notes-file "$RUNNER_TEMP/release-notes.md" --generate-notes)
        if [[ -n "$PREVIOUS_TAG" ]]; then
          arguments+=(--notes-start-tag "$PREVIOUS_TAG")
        fi
        gh release create "$RELEASE_TAG" "${arguments[@]}" \
          ./build/*.tar.gz ./build/*.zip ./build/SHA256SUMS ./build/oneclickvirt-skill*.sha256
    env:
      GOPROXY: https://proxy.golang.org|direct
'on':
  workflow_dispatch: null
  push:
    tags:
    - release-trigger-*
