name: Build real integration Agent
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
concurrency:
  group: build-test-agent-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false
jobs:
  build:
    name: Test Agent (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: amd64
          runner: ubuntu-latest
          target: x86_64-unknown-linux-musl
        - arch: arm64
          runner: ubuntu-24.04-arm
          target: aarch64-unknown-linux-musl
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
      with:
        targets: ${{ matrix.target }}
        toolchain: stable
    - name: Install musl tools
      run: sudo apt-get update && sudo apt-get install -y musl-tools
    - name: Configure native musl linker for the target
      env:
        AGENT_TARGET: ${{ matrix.target }}
      run: |
        set -euo pipefail
        command -v musl-gcc
        case "$AGENT_TARGET" in
          x86_64-unknown-linux-musl)
            echo 'CC_x86_64_unknown_linux_musl=musl-gcc' >> "$GITHUB_ENV"
            echo 'CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc' >> "$GITHUB_ENV"
            ;;
          aarch64-unknown-linux-musl)
            echo 'CC_aarch64_unknown_linux_musl=musl-gcc' >> "$GITHUB_ENV"
            echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc' >> "$GITHUB_ENV"
            ;;
          *)
            echo "Unsupported Agent target: $AGENT_TARGET" >&2
            exit 1
            ;;
        esac
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          server/agent/target
        key: integration-agent-${{ matrix.target }}-${{ hashFiles('server/agent/Cargo.lock') }}
    - name: Build and package the current Agent source
      working-directory: server/agent
      env:
        AGENT_TARGET: ${{ matrix.target }}
        AGENT_ARCH: ${{ matrix.arch }}
      run: |
        set -euo pipefail
        cargo build --locked --release --target "$AGENT_TARGET"
        mkdir -p dist
        cp "target/$AGENT_TARGET/release/oneclickvirt-agent" "dist/oneclickvirt-agent-linux-$AGENT_ARCH"
        tar -czf "dist/oneclickvirt-agent-linux-$AGENT_ARCH.tar.gz" -C dist "oneclickvirt-agent-linux-$AGENT_ARCH"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: integration-agent-${{ matrix.arch }}
        path: server/agent/dist/*.tar.gz
        if-no-files-found: error
'on':
  workflow_call: null
