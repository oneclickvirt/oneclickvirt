name: Sync public repositories to CNB

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: sync-cnb-public-repositories
  cancel-in-progress: false

jobs:
  sync-source:
    if: github.repository == 'oneclickvirt/oneclickvirt' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate CNB credentials
        env:
          CNB_PUSH_USERNAME: ${{ secrets.CNB_PUSH_USERNAME }}
          CNB_PUSH_TOKEN: ${{ secrets.CNB_PUSH_TOKEN }}
        run: |
          if [ -z "${CNB_PUSH_USERNAME}" ]; then
            echo "::error::Repository secret CNB_PUSH_USERNAME is not configured."
            exit 1
          fi
          if [ -z "${CNB_PUSH_TOKEN}" ]; then
            echo "::error::Repository secret CNB_PUSH_TOKEN is not configured."
            exit 1
          fi

      - name: Test public snapshot synchronization
        run: |
          set -euo pipefail
          bash scripts/tests/cnb_snapshot_test.sh
          bash scripts/tests/cnb_sync_test.sh

      - name: Synchronize public source snapshots
        env:
          CNB_PUSH_USERNAME: ${{ secrets.CNB_PUSH_USERNAME }}
          CNB_PUSH_TOKEN: ${{ secrets.CNB_PUSH_TOKEN }}
          GIT_TERMINAL_PROMPT: '0'
        run: bash scripts/sync_cnb_repositories.sh
