name: Agent lifecycle regressions
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
concurrency:
  group: agent-regressions-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true
jobs:
  controller:
    name: Go controller Agent lifecycle race tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: server/go.mod
        cache-dependency-path: server/go.sum
    - name: Test shared Agent connection and terminal lifecycle with race detection
      run: go test -count=1 -race ./service/agent ./service/console ./api/v1/admin
    - name: Vet controller Agent and terminal packages
      run: go vet ./service/agent ./service/console ./api/v1/admin
    env:
      GOPROXY: https://proxy.golang.org|direct
  test:
    name: Real PTY and Agent tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - macos-latest
    defaults:
      run:
        working-directory: server/agent
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
      with:
        toolchain: stable
    - name: Run all native Agent tests
      run: cargo test --locked --all-targets
    - name: Check Rust formatting
      run: cargo fmt --all -- --check
    - name: Run strict Agent clippy checks
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings
    - name: Install Linux release target dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y musl-tools
        rustup target add x86_64-unknown-linux-musl
    - name: Run all tests against the Linux musl release target
      if: runner.os == 'Linux'
      run: cargo test --locked --all-targets --target x86_64-unknown-linux-musl
'on':
  push:
    paths:
    - server/agent/**
    - server/service/agent/**
    - server/service/console/**
    - server/api/v1/admin/*terminal*.go
    - server/go.mod
    - server/go.sum
    - .github/workflows/agent-regressions.yml
  pull_request:
    paths:
    - server/agent/**
    - server/service/agent/**
    - server/service/console/**
    - server/api/v1/admin/*terminal*.go
    - server/go.mod
    - server/go.sum
    - .github/workflows/agent-regressions.yml
  workflow_dispatch: null
