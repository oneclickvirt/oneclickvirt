name: Agent native runtimes

on:
  workflow_dispatch:
    inputs:
      runtime:
        description: Native runtime to test
        type: choice
        default: all
        options: [all, docker, podman, containerd, incus, lxd, qemu, pve, kubevirt]

permissions:
  contents: read

jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        runtime: ${{ fromJSON(inputs.runtime == 'all' && '["docker","podman","containerd","incus","lxd","qemu","pve","kubevirt"]' || format('["{0}"]', inputs.runtime)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Prepare integration and official MCP client
        run: |
          python integrations/generate.py --output integrations/staged
          python -m pip install 'mcp>=1.16,<2'
      - name: Provision a disposable native runtime and exercise MCP
        env:
          INTEGRATION_RUNTIME: ${{ matrix.runtime }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/test-agent-runtime.sh
